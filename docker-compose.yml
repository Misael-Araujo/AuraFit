services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aurafit}
      POSTGRES_USER: ${POSTGRES_USER:-aurafit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurafit-local-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aurafit-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aurafit-minio-local-only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 15

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" && mc mb --ignore-existing local/aurafit-private && mc anonymous set none local/aurafit-private
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aurafit-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aurafit-minio-local-only}

  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aurafit}
      DATABASE_USERNAME: ${POSTGRES_USER:-aurafit}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-aurafit-local-only}
      JWT_SECRET: ${JWT_SECRET:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-no-reply@aurafit.local}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-aurafit-private}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-aurafit-local}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-aurafit-minio-local-only}
      S3_FORCE_PATH_STYLE: "true"
      SWAGGER_UI_ENABLED: ${SWAGGER_UI_ENABLED:-true}
      PUBLIC_BASE_URL: http://localhost:8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

volumes:
  postgres-data:
  minio-data:
