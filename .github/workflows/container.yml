name: Container

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build --tag aurafit:${{ github.sha }} .
      - name: Scan container
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: aurafit:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Tag and publish
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker tag "aurafit:${GITHUB_SHA}" "$IMAGE"
          docker push "$IMAGE"
